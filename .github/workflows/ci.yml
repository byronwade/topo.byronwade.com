name: Topo CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @topo/browser exec playwright install chromium
      - run: pnpm docs:check
      - run: pnpm exec turbo run typecheck
      - run: pnpm exec turbo run test
      - run: pnpm exec turbo run build
      - run: pnpm --filter @topo/cli pack:check
      - run: pnpm benchmark --profile smoke --check

  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: studio-runtime
            command: pnpm verify:studio-runtime
          - name: studio-boards
            command: pnpm verify:studio-boards
          - name: studio-profiles
            command: pnpm verify:studio-profiles
          - name: local-runtime
            command: pnpm verify:local-runtime
          - name: framework-fixtures
            command: pnpm verify:framework-fixtures
          - name: storybook
            command: pnpm verify:storybook
          - name: browser-benchmark
            command: pnpm benchmark --browser --profile smoke --format json --output artifacts/benchmarks/browser-smoke.json --check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @topo/browser exec playwright install chromium
      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topo-${{ matrix.check.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/studio/dist/*report.json
            apps/studio/dist/studio-board-screenshots/
            artifacts/**/*.json
            artifacts/**/*.png
