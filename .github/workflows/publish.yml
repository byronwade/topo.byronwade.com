name: Publish Topo CLI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish @topo/cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - name: Verify release source
        run: pnpm exec turbo run typecheck test build --filter=@topo/cli...
      - name: Build and consumer-test the publish artifact
        run: pnpm --filter @topo/cli pack:check
        env:
          TOPO_RELEASE_TAG: ${{ github.event.release.tag_name }}
          TOPO_PACK_OUTPUT: ${{ runner.temp }}/topo-cli.tgz
      - name: Retain the verified tarball
        uses: actions/upload-artifact@v4
        with:
          name: topo-cli-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/topo-cli.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11
      - name: Publish the verified tarball
        run: npm publish "$TOPO_PACK_OUTPUT" --access public --provenance
        env:
          TOPO_PACK_OUTPUT: ${{ runner.temp }}/topo-cli.tgz
