<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topo browser benchmark</title>
    <style>
      html,
      body,
      #benchmark-host {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090a0c;
      }

      #benchmark-status {
        position: fixed;
        z-index: 10;
        top: 12px;
        left: 12px;
        padding: 6px 8px;
        border: 1px solid #262a31;
        border-radius: 5px;
        color: #aeb5c1;
        background: rgb(9 10 12 / 86%);
        font:
          11px/1.4 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <div id="benchmark-host"></div>
    <div id="benchmark-status">Topo browser benchmark ready</div>
    <script type="module" src="/src/browser-harness.ts"></script>
  </body>
</html>
